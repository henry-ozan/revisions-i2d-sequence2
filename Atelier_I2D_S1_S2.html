<style>

body { margin:0; color:var(--ink); background:var(--paper); font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }

.nav { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }

.hero { display:grid; grid-template-columns:minmax(0,1.09fr) minmax(0,.91fr); gap:clamp(15px,4vw,50px); align-items:center; background:var(--white); border:1px solid var(--line); border-radius:27px; padding:clamp(20px,4vw,48px); }

.badge.amber { color:#6b3b02; background:var(--warm); }

.eq { font-size:clamp(.96rem,2.15vw,1.37rem); background:var(--blue-wash); color:#112f84; border:1px solid #c1cdf6; border-radius:12px; padding:10px 12px; }
sub,sup { line-height:0; }
.detail-grid { display:grid; gap:16px; grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); align-items:start; }
.symbols { display:flex; flex-wrap:wrap; gap:6px; }

.symbol-box { min-height:120px; background:#f3f6ff; border-radius:12px; padding:13px; }
.symbol-box p+p { margin-top:4px; }
summary { display:list-item; min-height:44px; padding:8px 0; cursor:pointer; font-weight:770; color:var(--blue-dark); }
dl { margin:0; }
dl>div { padding:8px 0; border-top:1px solid var(--line); }
dt { font-weight:780; }
dd { margin:2px 0 0; color:var(--muted); }
.method { list-style:none; padding:0; margin:0; display:grid; gap:9px; counter-reset: steps; }
.method li { display:grid; grid-template-columns:30px 1fr; gap:10px; align-items:start; counter-increment:steps; }

.example { background:#f0f4ff; border-color:#c6d2f3; }
.example p+ p { margin-top:7px; }
.recall { background:var(--warm); border:1px solid #eacb97; border-radius:var(--r); padding:clamp(14px,2.35vw,24px); }
.dense-list { padding-left:20px; margin-block:5px; }
.dense-list li+li { margin-top:5px; }
.sim { background:#172958; color:#f4f7ff; border:1px solid #2d4583; padding:clamp(15px,3.3vw,34px); border-radius:var(--r); min-width:0; }
.sim .eyebrow,.sim .muted { color:#d7e2ff; }
.sim-display { min-height:74px; color:var(--lemon); font-size:clamp(1.65rem,4.6vw,3.35rem); line-height:1.17; font-weight:850; font-variant-numeric:tabular-nums; letter-spacing:-.046em; }
.sim-display .sim-caption { display:block; color:#f4f7ff; font-size:.93rem; font-weight:650; letter-spacing:0; line-height:1.4; margin-top:5px; }
.sim input[type=range] { display:block; width:100%; min-height:44px; accent-color:var(--lemon); }
.range-labels { display:flex; justify-content:space-between; gap:5px; color:#e2e9ff; font-size:.83rem; }
.flow { display:flex; flex-wrap:wrap; align-items:stretch; gap:7px; }
.flow button { min-height:44px; padding:7px 11px; border:1px solid #a8b8db; border-radius:9px; color:var(--blue-dark); background:white; text-align:left; font-weight:730; }
.flow button[aria-pressed=true] { background:var(--blue); border-color:var(--blue); color:white; }
.flow .arrow { display:inline-flex; align-items:center; font-weight:780; color:var(--blue-dark); }
.sequence-svg { display:block; width:100%; max-width:680px; height:auto; border:1px solid #c6d2f3; background:#f4f7ff; border-radius:12px; }
.sequence-svg text { fill:var(--ink); font:16px system-ui,sans-serif; }
.sequence-svg .life { stroke:#7890bd; stroke-dasharray:5 5; }
.sequence-svg .message-line { stroke:#24458e; stroke-width:2; }
.sequence-svg .active .message-line { stroke:#a94e00; stroke-width:3; }
.sequence-svg .reply { stroke-dasharray:7 5; }
.sequence-svg .band-row { fill:transparent; }
.sequence-svg .active .band-row { fill:#ffebc8; }
.stations { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.station { width:100%; min-height:48px; padding:8px 10px; background:white; color:var(--ink); border:1px solid var(--line); border-radius:10px; display:flex; gap:8px; align-items:center; text-align:left; }
.station b { display:grid; place-items:center; width:28px; height:28px; flex:none; border-radius:7px; background:#e5ebff; color:var(--blue-dark); }
.station[aria-pressed=true] { border:2px solid var(--blue); background:#edf2ff; }
.station small { margin-left:auto; color:var(--muted); text-align:right; }
.ds-layout { display:grid; grid-template-columns:minmax(205px,.43fr) minmax(0,1fr); gap:14px; align-items:start; }
.work-card { margin-top:14px; }
.question-form { display:grid; gap:11px; }
.question-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.field { min-width:0; }
.field.wide { grid-column:1/-1; }
label,.label { display:block; font-weight:720; margin-bottom:4px; }
input:not([type=range]):not([type=file]),select,textarea { color:var(--ink); background:white; border:1px solid #899ab8; border-radius:9px; padding:9px 10px; font-size:16px; min-height:46px; width:100%; }
textarea { min-height:94px; resize:vertical; }
[readonly],select:disabled { background:#eef1f8!important; color:var(--ink); opacity:1; }
.unit-field { display:flex; gap:7px; align-items:center; }
.unit-field input { min-width:0; }
.unit { color:var(--muted); font-weight:690; font-size:.87rem; flex:none; }
.mark { display:block; font-size:.86rem; margin-top:3px; color:var(--muted); }
.mark:empty,.feedback:empty,.notice:empty { display:none; }
.mark[data-tone=good] { color:var(--green); }
.mark[data-tone=retry] { color:var(--warn); }
.feedback,.hint,.solution,.note { padding:10px 12px; background:var(--blue-wash); color:#173574; border-radius:10px; }
.feedback[data-tone=good],.solution { color:#154c3b; background:var(--green-wash); }
.feedback[data-tone=retry],.hint { color:var(--warn); background:var(--warm); }
.hint p+p { margin-top:6px; }
.problem { white-space:pre-line; }
.bottom { display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; border-top:1px solid var(--line); margin-top:29px; padding-top:9px; }
.bottom .storage { flex:1 1 230px; }
.notice { color:var(--blue-dark); margin-top:4px; font-weight:690; }
.list { list-style:none; margin:0; padding:0; }
.list li+li { border-top:1px solid var(--line); }
.list li { padding:7px 0; }
.list button { text-align:left; }
#rendu-preview { overflow-wrap:anywhere; }
noscript { display:block; padding:20px; }
@media (max-width:850px) {
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .top-inner { justify-content:flex-start; }
}

  html { scroll-padding-top:16px; }
  .top { position:static; }
  .nav button { padding-inline:8px; font-size:.84rem; }
  .hero,.detail-grid,.grid.two,.ds-layout { grid-template-columns:minmax(0,1fr); }
  .hero { gap:17px; padding:17px; }

  .grid .card { padding:11px; }

}

@media print { .top,.bottom,.btn,.quiet,.link-btn,.filters,input[type=range] { display:none!important; } body{background:white;} .wrap{padding:0;} .panel,.card,.band{break-inside:avoid;} }
</style>

<header class="top">
  <div class="top-inner">
    <button class="brand" type="button" data-action="view" data-id="home"><span class="brand-mark" aria-hidden="true">I2D</span><span>Atelier I2D</span></button>

<main id="main" class="wrap" tabindex="-1"></main>
<input id="import-file" type="file" accept=".json,application/json" hidden>
<noscript>Active JavaScript pour utiliser les fiches et les exercices interactifs. Avec une calculatrice et une feuille, retrouve les relations E = P × t, R = e / λ et η = E utile / E absorbée, puis indique l’unité de chaque grandeur.</noscript>
<script>
const groups = [
  {id:'base',name:'Énergie et conversions',lead:'Relier puissance, durée, énergie et rendement.'},
  {id:'bilan',name:'Éclairage, batterie et coût',lead:'Compter les usages, dimensionner un stock et interpréter une économie.'},
  {id:'chaleur',name:'Chaleur et isolation',lead:'Distinguer l’énergie de chauffe du transfert à travers une paroi.'},
  {id:'impact',name:'Cycle de vie et impacts',lead:'Comparer à service équivalent, puis chiffrer les écarts.'},
  {id:'production',name:'Ressources, vent et soleil',lead:'Relier une ressource au potentiel puis à la production.'},
  {id:'trajet',name:'Trajets et énergie primaire',lead:'Passer de la distance à une comparaison énergétique.'}
];
const n = (key,label,unit,answer,tolerance=0.000001) => ({key,label,unit,answer,tolerance,type:'number'});
const c = (key,label,options,correct) => ({
  key,label,type:'choice',options:options.map((label,i)=>({value:String(i),label})),answer:String(correct)
});
const w = (key,label) => ({key,label,type:'text'});
const task = (id,title,prompt,fields,hints,solution) => ({id,title,prompt,fields,hints,solution});
const symbols = (...entries) => entries.map(([label,reading,meaning,unit])=>({label,reading,meaning,unit}));
const formulas = [
{
  id:'ept', group:'base', seq:[1,2], title:'Énergie, puissance et durée', cue:'Tu connais deux grandeurs et tu cherches la troisième.',
  eq:['E = P × t','P<sub>moy</sub> = E / Δt','t = E / P'],
  defs:symbols(
    ['E','lettre E','Énergie transférée ou consommée.','J, Wh ou kWh'],
    ['P','lettre P','Puissance constante. Elle indique à quel rythme l’énergie est transférée.','W ou kW'],
    ['Pₘₒᵧ','P moyenne','Puissance moyenne sur l’intervalle étudié.','W ou kW'],
    ['t','lettre t','Durée d’utilisation.','s ou h'],
    ['Δt','delta t','Durée entre deux instants. Delta indique un écart.','s ou h']
  ),
  method:['Entoure la grandeur cherchée, puis choisis la forme de la relation qui l’isole.','Associe W et s pour obtenir des J, W et h pour des Wh ou kW et h pour des kWh.','Remplace les valeurs et indique l’unité obtenue. Pour une puissance variable, travaille par périodes ou utilise la puissance moyenne sur la période.'],
  memo:'La puissance donne le rythme. L’énergie est ce qui s’accumule pendant la durée.',
  trap:'Une durée en minutes doit être convertie avant le produit. Le kW mesure une puissance et le kWh mesure une énergie.',
  ex:['Un appareil de 240 W fonctionne à puissance constante pendant 45 min. Cherche son énergie en kWh.','240 W = 0,240 kW et 45 min = 45 ÷ 60 = 0,75 h.','E = 0,240 × 0,75 = 0,180 kWh. Si la durée double à puissance constante, l’énergie double.'],
  exercise:task('F-EPT','Le ventilateur du fablab','Un ventilateur de 360 W tourne 35 min. Calcule son énergie en Wh, puis en kWh.',
    [n('wh','Énergie','Wh',210),n('kwh','Même énergie','kWh',0.21)],
    ['35 min correspond à 35 ÷ 60 h.','Commence par W × h. Divise les Wh par 1 000 pour obtenir des kWh.'],
    't = 35/60 h. E = 360 × 35/60 = 210 Wh = 0,210 kWh.')
},
{
  id:'unites', group:'base', seq:[1,2], title:'Convertir les énergies et les durées', cue:'Tu dois changer l’unité d’un résultat ou rendre un calcul cohérent.',
  eq:['1 J = 1 W·s','1 ch ≈ 736 W','1 Wh = 3 600 J','1 kWh = 3,6 MJ = 3 600 000 J','1 tep ≈ 11,63 MWh ≈ 41,9 GJ','1 h = 60 min = 3 600 s'],
  defs:symbols(
    ['ch','cheval-vapeur','Unité de puissance utilisée dans le TD des véhicules.','≈ 736 W'],
    ['J','joule','Unité d’énergie. W·s signifie watt multiplié par seconde.','1 kJ = 10³ J'],
    ['Wh','wattheure','Énergie transférée à 1 W pendant 1 h.','1 kWh = 10³ Wh'],
    ['MJ','mégajoule','Énergie en millions de joules.','1 MJ = 10⁶ J = 1 000 kJ'],
    ['GJ','gigajoule','Énergie en milliards de joules.','1 GJ = 10⁹ J'],
    ['tep','tonne équivalent pétrole','Unité d’énergie. Utilise l’arrondi imposé dans l’exercice.','≈ 11 630 kWh'],
    ['k / M / G / T','kilo, méga, giga, téra','Préfixes qui multiplient l’unité par une puissance de dix.','10³, 10⁶, 10⁹, 10¹²']
  ),
  method:['Écris une égalité d’unités qui relie le départ à l’arrivée.','Multiplie pour passer à l’unité plus petite. Divise dans le sens inverse.','Pour une durée décimale, 0,5 h représente la moitié d’une heure, soit 30 min. Pour la puissance, 1 kW = 1 000 W.'],
  memo:'Une heure contient 3 600 secondes. C’est de là que vient le 3 600 entre Wh et J.',
  trap:'Passer de kWh à J combine deux facteurs, 1 000 et 3 600. Pour la tep, la lettre t n’indique pas la masse d’un combustible quelconque.',
  ex:['Convertis 0,42 kWh en MJ et en J.','En MJ, multiplie par 3,6 : 0,42 × 3,6 = 1,512 MJ.','En J, multiplie les MJ par 10⁶ : 1 512 000 J.'],
  exercise:task('F-CONV','Trois changements d’échelle','Convertis 2,75 kWh en MJ et 7,2 MJ en kWh. Dans un dossier, 1 tep est arrondie à 11,63 MWh. Convertis 34,89 MWh en tep.',
    [n('mj','2,75 kWh','MJ',9.9),n('kwh','7,2 MJ','kWh',2),n('tep','34,89 MWh','tep',3)],
    ['De kWh vers MJ, multiplie par 3,6. Dans l’autre sens, divise.','Pour la tep, demande-toi combien de blocs de 11,63 MWh sont contenus dans 34,89 MWh.'],
    '2,75 × 3,6 = 9,9 MJ. 7,2 ÷ 3,6 = 2 kWh. 34,89 ÷ 11,63 = 3 tep.')
},
{
  id:'combustion',group:'base',seq:[1,2],title:'Énergie d’un combustible et PCI',cue:'Tu connais la masse de combustible ou l’énergie à libérer.',
  eq:['E<sub>libérée</sub> = m × PCI','m = E<sub>libérée</sub> / PCI','E<sub>utile</sub> = η × E<sub>libérée</sub>'],
  defs:symbols(
    ['E','lettre E','Énergie libérée par combustion ou part utile selon l’indice.','MJ, kWh ou J'],
    ['m','lettre m minuscule','Masse de combustible.','kg'],
    ['PCI','pouvoir calorifique inférieur','Énergie par unité de masse sans récupération de la chaleur de condensation de l’eau formée.','MJ/kg, kWh/kg ou J/kg'],
    ['PCS','pouvoir calorifique supérieur','Inclut la chaleur de condensation de l’eau formée. Pour le même combustible qui produit de l’eau, le PCS dépasse le PCI.','Même unité que le PCI'],
    ['η','êta','Rendement de l’appareil sous forme décimale.','Sans unité']
  ),
  method:['Vérifie si l’énoncé donne une valeur par kg ou par litre. Ici, travaille avec une masse en kg.','Multiplie par la masse pour l’énergie. Divise l’énergie par le PCI pour retrouver la masse.','Si l’énoncé cherche la chaleur utile et donne un rendement, applique-le à l’énergie libérée.'],
  memo:'Le PCI dit ce que fournit un seul kg. Multiplie par le nombre de kg.',
  trap:'Un PCI exprimé en MJ/kg ne se multiplie pas directement par des litres. Si une masse volumique est donnée, commence par obtenir la masse.',
  ex:['On brûle 3,2 kg de granulés de PCI 17 MJ/kg. Le rendement utile est de 75 %.','Énergie libérée : 3,2 × 17 = 54,4 MJ.','Énergie utile : 54,4 × 0,75 = 40,8 MJ.'],
  exercise:task('F-PCI','Approvisionner un appareil','Tu cherches à libérer 117 MJ avec un combustible de PCI 18 MJ/kg. Calcule la masse, puis choisis ce qui explique la différence entre PCI et PCS.',

  eq:['E<sub>grise</sub> = Σ E<sub>hors usage</sub>','E<sub>cycle</sub> = E<sub>grise</sub> + E<sub>usage</sub>'],
  defs:symbols(
    ['Σ','sigma majuscule','Somme des contributions retenues dans le périmètre.','Même unité pour toutes les contributions'],
    ['Egrise','E grise','Ici, énergie d’extraction, fabrication, distribution et fin de vie. La convention peut varier.','MJ ou kWh'],
    ['Eusage','E usage','Énergie consommée en phase d’usage.','Même unité'],
    ['Ecycle','E du cycle','Énergie cumulée sur les étapes prises en compte.','Même unité']
  ),
  method:['Trace les étapes et écris lesquelles sont incluses dans l’énergie grise.','Mets les quantités d’énergie dans la même unité, puis additionne les étapes retenues.','Ajoute l’usage pour le total. Pour comparer des solutions, garde la même unité fonctionnelle et le même périmètre.'],
  memo:'Grise ici : toutes les étapes comptées autour de l’usage. Total : ajoute l’usage.',
  trap:'Les émissions en kg CO₂e et les énergies en MJ sont des indicateurs distincts. Additionne seulement des contributions du même indicateur.',
  ex:['Extraction 9 MJ, fabrication 26, distribution 4, fin de vie 6, usage 54. Le périmètre gris exclut l’usage.','E grise = 9 + 26 + 4 + 6 = 45 MJ.','E cycle = 45 + 54 = 99 MJ.'],
  exercise:task('F-CYCLE','Le bilan d’un équipement','Les postes extraction, fabrication, distribution et fin de vie valent 14, 31, 8 et 7 MJ. L’usage vaut 87 MJ. Calcule le gris hors usage, puis le total.',
    [n('gris','Énergie grise','MJ',60),n('total','Cycle total','MJ',147)],
    ['Repère l’étape exclue de l’énergie grise.','Le total inclut aussi les 87 MJ d’usage.'],
    'Hors usage : 14 + 31 + 8 + 7 = 60 MJ. Total : 60 + 87 = 147 MJ.')
},
{
  id:'emissions',group:'impact',seq:[1,2],title:'Quantité et facteur d’émission',cue:'Un dossier donne des émissions par kilomètre, par litre ou par kWh.',
  eq:['M<sub>émissions</sub> = q × FE','M<sub>total</sub> = Σ M<sub>poste</sub>'],
  defs:symbols(
    ['Mémissions','M émissions','Masse de CO₂ ou de CO₂ équivalent selon le facteur fourni.','g, kg ou t de CO₂ ou CO₂e'],
    ['q','lettre q minuscule','Quantité d’activité. Par exemple distance, volume ou énergie.','km, L ou kWh'],
    ['FE','facteur d’émission','Masse émise par unité d’activité, dans le périmètre donné.','g/km, kg/L, kg CO₂e/kWh…'],
    ['Σ','sigma','Somme des postes du même indicateur, sans double comptage.','Même unité pour chaque poste']
  ),
  method:['Identifie la quantité et l’unité au dénominateur du facteur.','Multiplie. L’unité commune s’annule.','Convertis la masse si besoin et annonce le périmètre, par exemple l’usage seul.'],
  memo:'Quantité × « par unité » donne le total.',
  trap:'CO₂e agrège des gaz en équivalent CO₂. Reprends le libellé du facteur donné. Un facteur de combustion seul ne décrit pas tout le cycle de vie.',
  ex:['Un trajet de 75 km est étudié à 126 g CO₂/km.','M = 75 × 126 = 9 450 g CO₂.','9 450 g ÷ 1 000 = 9,45 kg CO₂ pour le trajet.'],
  exercise:task('F-FE','Un volume de carburant','Le dossier impose 2,42 kg CO₂/L pour la combustion. Pour 34 L utilisés, calcule les émissions en kg et en grammes dans ce périmètre.',
    [n('kg','Émissions','kg CO₂',82.28),n('g','Même masse','g CO₂',82280)],
    ['Les litres s’annulent dans L × kg/L.','Un kg contient 1 000 g.'],
    '34 × 2,42 = 82,28 kg CO₂. Cela représente 82 280 g CO₂. Le calcul porte sur la combustion.')
},
{
  id:'part',group:'impact',seq:[1,2],title:'Part, variation et réduction',cue:'Tu cherches un pourcentage et dois choisir la bonne référence.',
  eq:['Part en % = 100 × partie / total','Variation en % = 100 × (après − avant) / avant','Réduction en % = 100 × (avant − après) / avant'],
  defs:symbols(
    ['Partie','partie','Poste étudié dans un total de même nature et de même périmètre.','Même unité que le total'],
    ['Avant','valeur avant','Valeur de référence pour un changement, supposée non nulle.','Même unité qu’après'],
    ['%','pour cent','Fraction exprimée sur une base de 100.','Sans dimension']
  ),
  method:['Demande-toi si tu regardes une photo à un instant donné ou un changement avant/après.','Pour la part, divise le poste par le total. Pour le changement, divise l’écart par l’avant.','Annonce le signe pour une variation. Si l’on demande le gain d’une baisse, donne la réduction positive.'],
  memo:'Photo : poste sur total. Film : changement sur départ.',
  trap:'Un pourcentage portant sur un poste ne se reporte pas au total. Une variation relative à une valeur de départ nulle est indéfinie.',
  ex:['L’usage représente 25 kg CO₂e sur un total initial de 125 kg. Le nouveau total vaut 110 kg.','Part initiale de l’usage : 25/125 × 100 = 20 %.','Variation globale : (110 − 125)/125 × 100 = −12 %. Réduction globale : 12 %.'],
  exercise:task('F-PART','Deux pourcentages à distinguer','Un bilan initial vaut 160 kg CO₂e, dont 48 kg pour l’usage. Le nouveau total vaut 136 kg. Calcule la part initiale de l’usage, la variation signée du total et la réduction positive.',
    [n('part','Part initiale','%',30),n('var','Variation signée','%',-15),n('baisse','Réduction','%',15)],
    ['Pour la part et la variation de ce cas, le dénominateur vaut 160.','Après moins avant est négatif ici.'],
    'Part : 48/160 × 100 = 30 %. Variation : (136 − 160)/160 × 100 = −15 %. Réduction : 15 %.')
},
{
  id:'seuil',group:'impact',seq:[1],title:'Seuil de compensation d’un impact initial',cue:'Une solution démarre avec un impact supplémentaire, puis émet moins à chaque unité d’usage.',
  eq:['I(q) = I₀ + a × q','q<sub>seuil</sub> = (I₀B − I₀A) / (a<sub>A</sub> − a<sub>B</sub>)','t<sub>seuil</sub> = q<sub>seuil</sub> / q<sub>par an</sub>'],
  defs:symbols(
    ['I(q)','I en fonction de q','Impact cumulé jusqu’à la quantité d’usage q.','kg CO₂e dans cet exemple'],
    ['I₀','I zéro','Impact de départ dans le périmètre choisi.','kg CO₂e'],
    ['a','lettre a','Impact supplémentaire par unité d’usage. On peut aussi écrire y = ax + b, où b est l’impact initial.','kg CO₂e/km'],
    ['q','lettre q','Quantité d’usage. Au seuil, les bilans sont égaux.','km'],
    ['tseuil','t au seuil','Durée pour atteindre ce kilométrage au rythme supposé constant.','ans']
  ),
  method:['Écris les deux bilans pour la même quantité future et le même service.','Égalise les bilans. Dans le cas d’un surcoût initial de B et d’un gain par km, divise le surcoût par le gain unitaire.','Interprète avant, au et après le seuil. Si le gain unitaire est nul ou négatif, ce surcoût ne se compense pas dans le modèle.'],
  memo:'Combien de kilomètres pour rembourser l’impact initial ? Dette divisée par l’économie de chaque kilomètre.',
  trap:'Mets les deux facteurs dans la même unité. Le seuil carbone du modèle ne conclut pas sur les autres impacts.',
  ex:['A démarre à 0 kg CO₂e, B à 1 800 kg. Les usages valent 0,13 et 0,07 kg CO₂e/km.','Gain de B : 0,13 − 0,07 = 0,06 kg CO₂e/km. Seuil : 1 800 ÷ 0,06 = 30 000 km.','À 12 000 km/an, le seuil est atteint en 2,5 ans. Avant le seuil, A a le bilan inférieur.'],
  exercise:task('F-SEUIL','Quand l’achat compense-t-il la fabrication ?','Dans le bilan futur, A n’ajoute rien au départ et émet 0,16 kg CO₂e/km. B démarre à 2 700 kg et émet 0,10 kg/km. Calcule le seuil en km et en années à 15 000 km/an, puis choisis le meilleur bilan carbone à 60 000 km.',
    [n('km','Seuil','km',45000),n('ans','Durée','ans',3),c('choix','Bilan le plus faible à 60 000 km',['A','B','Égalité'],1)],
    ['Écris A(q) et B(q), puis calcule l’écart par kilomètre.','Compare 60 000 km au seuil que tu as trouvé.'],
    'Gain : 0,06 kg/km. Seuil : 2 700 ÷ 0,06 = 45 000 km, soit 3 ans. À 60 000 km, B a compensé son impact initial.')
},
{
  id:'stock',group:'production',seq:[1,2],title:'Stock, renouvellement et prélèvement',cue:'Une ressource se reconstitue à un rythme différent de son exploitation.',
  eq:['Stock<sub>final</sub> = Stock<sub>initial</sub> + (r − p) × Δt','t<sub>épuisement</sub> = Stock<sub>initial</sub> / (p − r) si p &gt; r'],
  defs:symbols(
    ['r','lettre r','Rythme de reconstitution supposé constant dans l’exercice.','t/an ou autre quantité par durée'],
    ['p','lettre p','Rythme de prélèvement dans le même périmètre.','Même unité que r'],
    ['Δt','delta t','Durée de l’étude.','an si les flux sont annuels'],
    ['Stock','quantité en réserve','Quantité restante à l’instant considéré.','t, m³…']
  ),
  method:['Relève le stock initial, les entrées et les sorties sur une même durée.','Calcule entrées moins sorties pour obtenir la variation du stock.','Si l’on demande une date théorique d’épuisement, divise le stock par la diminution par unité de temps, sous hypothèse de rythmes constants.'],
  memo:'Comme un compte : entrées positives, sorties négatives.',
  trap:'Une ressource renouvelable peut diminuer si on prélève plus vite qu’elle ne se reconstitue.',
  ex:['Une réserve de bois de 120 t croît de 11 t/an et on prélève 14 t/an.','Variation annuelle : 11 − 14 = −3 t/an.','Après 5 ans, le modèle donne 120 − 15 = 105 t.'],
  exercise:task('F-STOCK','Une réserve suivie sur plusieurs années','Le stock initial vaut 64 t. Il se reconstitue à 7 t/an et on en prélève 11 t/an. Calcule le stock après 6 ans et la durée théorique d’épuisement depuis le départ.',
    [n('reste','Stock après 6 ans','t',40),n('fin','Temps depuis le départ','ans',16)],
    ['La réserve diminue de 11 − 7 t chaque année.','La seconde question utilise le stock initial, pas le stock après 6 ans.'],
    'Le stock baisse de 4 t/an. Après 6 ans : 64 − 24 = 40 t. Durée théorique depuis le départ : 64 ÷ 4 = 16 ans.')
},
{
  id:'massevolume',group:'production',seq:[2],title:'Masse, volume et masse volumique',cue:'Il faut passer des litres de combustible aux kilogrammes.',
  eq:['ρ = m / V','m = ρ × V','V = m / ρ','1 m³ = 1 000 L'],
  defs:symbols(
    ['ρ','rhô','Masse volumique, masse par unité de volume. Ici celle du liquide.','kg/L ou kg/m³'],
    ['m','lettre m','Masse.','kg'],
    ['V','lettre V','Volume. Ici V est une grandeur, distincte du symbole V du volt.','L ou m³']
  ),
  method:['Vérifie l’unité au dénominateur de ρ.','Pour obtenir la masse, multiplie par le volume dans la bonne unité. Pour obtenir le volume, divise par ρ.','Convertis le volume final si nécessaire. Avec ρ en kg/L, la division donne des litres.'],
  memo:'ρ te dit combien pèse un litre ou un mètre cube.',
  trap:'Les kg/L et les kg/m³ diffèrent d’un facteur 1 000. Cette relation donne la masse, pas l’énergie.',
  ex:['Un réservoir contient 12 L d’un liquide de masse volumique 0,78 kg/L.','m = 0,78 × 12 = 9,36 kg.','Si le PCI est donné en MJ/kg, c’est cette masse qu’il faut utiliser.'],
  exercise:task('F-RHO','Des kilogrammes aux litres','Un liquide de masse 14,4 kg a une masse volumique de 0,80 kg/L. Calcule son volume en litres et en m³.',
    [n('l','Volume','L',18),n('m3','Même volume','m³',0.018)],
    ['Isole V.','Passe des litres aux mètres cubes en divisant par 1 000.'],
    'V = 14,4 ÷ 0,80 = 18 L = 0,018 m³.')
},
{
  id:'vent',group:'production',seq:[2],title:'Surface balayée et puissance du vent',cue:'Tu veux estimer la puissance cinétique disponible puis une limite de récupération.',
  eq:['S = πr² = πD² / 4','P<sub>vent</sub> = ½ ρ S v³','P<sub>Betz</sub> = (16/27) × P<sub>vent</sub>'],
  defs:symbols(
    ['π','pi','Constante géométrique, environ 3,1416.','Sans unité'],
    ['r, D','r rayon, D diamètre','Rayon balayé par les pales et diamètre du disque. D = 2r.','m'],
    ['S','lettre S','Surface du disque balayé.','m²'],
    ['ρ','rhô','Masse volumique de l’air. Prends la valeur donnée.','kg/m³'],
    ['v','lettre v minuscule','Vitesse du vent. Le cube vaut v × v × v.','m/s'],
    ['P','lettre P','Puissance disponible dans le vent ou limite théorique de récupération, selon l’indice.','W']
  ),
  method:['Convertis la vitesse en m/s. À partir de km/h, divise par 3,6. Si tu as le diamètre, divise-le par deux pour avoir le rayon.','Calcule la surface balayée, puis la puissance du vent.','Si la limite idéale est demandée, multiplie par 16/27. Une puissance électrique réelle dépend des conditions de la machine.'],
  memo:'Le rayon agit au carré. La vitesse agit au cube.',
  trap:'Doubler la vitesse multiplie le potentiel par huit dans le modèle. La puissance nominale ou produite ne suit pas automatiquement ce facteur.',
  ex:['Pour un disque de 30 m², un air à 1,2 kg/m³ et un vent à 8 m/s, calcule le potentiel.','P vent = 0,5 × 1,2 × 30 × 8³ = 9 216 W.','La limite de Betz vaut environ 5 461 W, avant les pertes de conversion.'],
  exercise:task('F-VENT','Une petite éolienne','Le rayon balayé vaut 4 m. Le vent souffle à 9 m/s, avec ρ = 1,2 kg/m³. Calcule la surface au centième, puis les puissances disponible et limite de Betz en kW au dixième.',
    [n('s','Surface','m²',16*Math.PI,0.0051),n('p','Puissance du vent','kW',0.5*1.2*16*Math.PI*9**3/1000,0.0501),n('b','Limite de Betz','kW',0.5*1.2*16*Math.PI*9**3/1000*16/27,0.0501)],
    ['Calcule d’abord π × 4², puis 9³.','La formule donne des watts. Divise par 1 000 pour les kW.'],
    'S ≈ 50,27 m². P vent ≈ 21,99 kW, soit 22,0 kW au dixième. Limite ≈ 13,03 kW, soit 13,0 kW au dixième.')
},
{
  id:'charge',group:'production',seq:[2],title:'Puissance moyenne et facteur de charge',cue:'Tu connais la production réelle d’une installation sur une période.',
  eq:['P<sub>moy</sub> = E<sub>prod</sub> / Δt','FC = E<sub>prod</sub> / (P<sub>nom</sub> × Δt) = P<sub>moy</sub> / P<sub>nom</sub>'],
  defs:symbols(
    ['FC','facteur de charge','Part de la production que donnerait une marche à puissance nominale sur toute la période.','Sans unité'],
    ['Eprod','E produite','Énergie réelle mesurée sur la période.','MWh ou kWh'],
    ['Pmoy, Pnom','P moyenne, P nominale','Puissance moyenne réelle et puissance de référence de l’installation.','MW ou kW'],
    ['Δt','delta t','Durée totale de la période de mesure.','h']
  ),
  method:['Associe MWh et h pour obtenir des MW, ou kWh et h pour des kW.','Calcule la puissance moyenne réelle, puis divise-la par la puissance nominale.','Exprime éventuellement le facteur en pourcentage. Pour un parc, multiplie l’énergie par machine par le nombre de machines, si elles sont supposées identiques.'],
  memo:'La référence est une machine à puissance nominale pendant toute la période.',
  trap:'Le facteur de charge compare deux productions sur la même période. Un rendement compare l’utile à ce qui est reçu par une conversion.',
  ex:['Une machine nominale de 1,5 MW produit 3 900 MWh en 8 000 h.','P moyenne = 3 900 ÷ 8 000 = 0,4875 MW.','FC = 0,4875 ÷ 1,5 = 0,325, soit 32,5 %.'],
  exercise:task('F-CHARGE','De l’énergie produite au facteur de charge','Une installation de 2,2 MW produit 4 950 MWh en 7 500 h. Calcule sa puissance moyenne et son facteur de charge en pourcentage.',
    [n('mw','Puissance moyenne','MW',0.66),n('fc','Facteur de charge','%',30)],
    ['Divise des MWh par des h.','Compare ensuite la puissance moyenne à la nominale.'],
    'P moyenne = 4 950/7 500 = 0,66 MW. FC = 0,66/2,2 = 0,30, soit 30 %.')
},
{

  defs:symbols(

    ['Δt','delta t','Durée de la période.','h'],
    ['FC','facteur de charge','Fraction réelle par rapport à un fonctionnement permanent au nominal.','Sans unité'],
    ['N','lettre N majuscule','Nombre d’installations. On arrondit au supérieur pour atteindre la cible.','Nombre sans unité'],
    ['Szone','S de la zone','Surface sur laquelle on rapporte le nombre de machines.','km² si la densité est par km²']
  ),

  exercise:task('F-PARC','Atteindre une cible de production','La cible est de 16 900 MWh. Sur la même période de 8 000 h, une machine de 2 MW fonctionne avec un facteur de charge de 25 %. Calcule la production par machine et le nombre entier minimal.',
    [n('mwh','Production par machine','MWh',4000),n('n','Nombre minimal','machines',5)],
    ['25 % s’écrit 0,25.','Quatre machines produiraient 16 000 MWh.'],
    'E machine = 2 × 8 000 × 0,25 = 4 000 MWh. 16 900 ÷ 4 000 = 4,225. Il faut 5 machines.')
},
{

    ['P','lettre P','Puissance reçue ou utile.','W'],
    ['η','êta','Rendement retenu dans le modèle.','Sans unité']
  ),
  method:['Relève la puissance par m² et la surface, ou isole S si elle est cherchée.','Convertis le rendement en nombre décimal.','Vérifie que la puissance utile est inférieure à la puissance incidente dans ce modèle de conversion.'],
  memo:'Des W par m² multipliés par des m² donnent des W reçus.',
  trap:'Le rayonnement par surface est une puissance par m². Pour une énergie, il faut aussi une durée ou une donnée énergétique intégrée.',
  ex:['Sur 40 m², le rayonnement reçu vaut 320 W/m². Le rendement fictif est de 18 %.','P reçue = 320 × 40 = 12 800 W.','P utile = 12 800 × 0,18 = 2 304 W.'],
  exercise:task('F-CAPT','Une surface à déterminer','On vise 4 800 W utiles avec un rayonnement reçu de 400 W/m² et un rendement de 20 %. Calcule la surface puis la puissance incidente.',

    'S = 4 800 ÷ (0,20 × 400) = 60 m². P incidente = 400 × 60 = 24 000 W.')
},

function sanitize(raw) {
  if (!raw || raw.activity!==activity || raw.version!==version) throw new Error('Cette sauvegarde appartient à une autre activité ou version.');
  const state = fresh();
  state.view = pick(raw.view,views,state.view);
  state.formula = pick(raw.formula,formulas.map(f=>f.id),state.formula);
  state.theme = pick(raw.theme,themes.map(t=>t.id),state.theme);
  state.origin = pick(raw.origin,['formulas','themes','theme','ds'],state.origin);
  state.themeQuestion=clampInt(raw.themeQuestion,0,themes.find(t=>t.id===state.theme).exercises.length-1);
  state.station=clampInt(raw.station,0,dsReview.length-1);
  state.examIndex=clampInt(raw.examIndex,0,dsExam.length-1);
  state.examStarted=raw.examStarted===true || state.view==='exam';
  state.examDone=state.examStarted && raw.examDone===true;
  state.firstName=text(raw.firstName,50);
  state.prefix=text(raw.prefix,12);
  state.assessment=pick(raw.assessment,statusChoices,'');
  state.reflection=text(raw.reflection,850);
  const answers = obj(raw.records);
  for (const q of exercises) {
    if (!answers[q.id] || (dsExam.includes(q) && !state.examStarted)) continue;
    const saved=obj(answers[q.id]);
    const record=emptyRecord();
    for (const f of q.fields) {
      const max=f.type==='text'?1400:80;
      let current=text(obj(saved.answers)[f.key],max);
      let first=text(obj(saved.first)[f.key],max);
      if (f.options) {
        const allowed=f.options.map(o=>o.value);
        current=pick(current,allowed,'');
        first=pick(first,allowed,'');
      }
      record.answers[f.key]=current;
      record.first[f.key]=first;
    }
    record.attempts=dsExam.includes(q) && !state.examDone ? 0 : clampInt(saved.attempts,0,999);
    record.hints=clampInt(saved.hints,0,q.hints.length);
    record.checked=record.attempts>0 && saved.checked===true;
    record.reviewed=saved.reviewed===true && (!dsExam.includes(q) || state.examDone);
    state.records[q.id]=record;
  }
  return state;
}

function parseNumber(raw) {
  const value=raw.trim().replace(/\s/gu,'').replace(',','.').replace(/^−/u,'-').replace(/[×x]10\^/iu,'e');
  return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(value) ? Number(value) : NaN;
}
function grade(f,raw) {
  const value=raw || '';
  if (!value.trim()) return 'empty';
  if (f.type==='text') return 'text';
  if (f.type==='choice') return value===f.answer ? 'good' : 'retry';
  const number=parseNumber(value);
  if (!Number.isFinite(number)) return 'format';
  return Math.abs(number-f.answer) <= Math.max(f.tolerance || 0,1e-9) ? 'good' : 'retry';
}

function used(q) {

function passed(q) {
  const r=recordOf(q.id);

  return r.checked && closed.length>0 && closed.every(f=>grade(f,r.answers[f.key])==='good');
}

function orderedOptions(q,f) {
  const options=f.options.slice();
  let seed=2166136261;
  for (const ch of q.id+'-'+f.key) seed=Math.imul(seed^ch.charCodeAt(0),16777619)>>>0;
  for (let i=options.length-1;i>0;i--) {
    seed=(Math.imul(seed,1664525)+1013904223)>>>0;
    const j=seed%(i+1);
    [options[i],options[j]]=[options[j],options[i]];
  }
  return options;
}

function normalized(s) {
  return s.replace(/<[^>]+>/gu,' ').normalize('NFD').replace(/\p{M}/gu,'').toLocaleLowerCase('fr-FR')
    .replace(/[=×·/]/gu,' ').trim();
}
function formulaList() {

    const source=normalized([f.title,f.cue,...f.eq,...f.defs.flatMap(d=>[d.label,d.reading,d.meaning,d.unit])].join(' '));
    return (!ui.sequence || f.seq.includes(ui.sequence)) && tokens.every(token=>source.includes(token));
  });
  const sections=groups.map(group=>{
    const items=matched.filter(f=>f.group===group.id);

    return `<section class="group-block" aria-labelledby="group-${group.id}">

  return `<p class="small muted" role="status">${matched.length} fiche${matched.length===1?'':'s'}</p>

function fieldHTML(q,f,r,locked) {
  const id='q-'+q.id+'-'+f.key;
  const value=r.answers[f.key]??'';
  const attrs=`id="${id}" data-q="${q.id}" data-field="${f.key}" aria-describedby="${id}-mark"`;
  const label=`<label for="${id}">${esc(f.label)}${f.unit?` <span class="small muted">(${esc(f.unit)})</span>`:''}</label>`;
  let control='';
  if (f.type==='choice') {
    control=`<select ${attrs} ${locked?'disabled':''}><option value="">Choisir une réponse</option>
      ${orderedOptions(q,f).map(o=>`<option value="${esc(o.value)}" ${value===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
    </select>`;
  } else if (f.type==='text') {
    control=`<textarea ${attrs} rows="3" maxlength="1400" ${locked?'readonly':''}>${esc(value)}</textarea>`;
  } else {
    control=`<div class="unit-field"><input ${attrs} type="text" inputmode="decimal" maxlength="80" autocomplete="off" value="${esc(value)}" ${locked?'readonly':''}>
      ${f.unit?`<span class="unit" aria-hidden="true">${esc(f.unit)}</span>`:''}</div>`;
  }
  const result=r.checked?grade(f,value):'';
  const tone=result==='good'?'good':result==='text'?'':'retry';
  return `<div class="field ${f.type==='text'?'wide':''}">${label}${control}
    <small class="mark" data-tone="${tone}" id="${id}-mark">${messages[result]||''}</small></div>`;
}

    b.setAttribute('aria-pressed',String(Number(b.dataset.id)===index));
  }
}
function resetFormulaPanel() {
  ui.symbol=0;
  ui.example=0;
  ui.recall=false;
}
function navigateQuestion(index,type) {
  state[type]=index;
  notice='';
  persist();
  render();
  focus(type==='station'?'ds-method':'question-title');
}
function runCheck(form) {
  const q=byExercise.get(form.dataset.question);
  if (!q || dsExam.includes(q)) return;
  const record=recordOf(q.id);
  if (!Object.values(record.answers).some(v=>v.trim())) {
    const feedback=get('question-feedback');
    feedback.textContent='Essaie au moins une réponse avant de vérifier.';
    feedback.focus();
    return;
  }
  attempt(q);
  persist();
  render();
  focus('question-feedback');
}
function finishExam() {
  if (state.examDone || !state.examStarted) return;
  const missing=dsExam.reduce((total,q)=>total+q.fields.filter(f=>!recordOf(q.id).answers[f.key]?.trim()).length,0);
  if (missing && !confirm(missing+' réponse(s) manquante(s). Veux-tu valider le mini-DS et figer tes réponses ?')) return;
  for (const q of dsExam) attempt(q);
  state.examDone=true;
  state.examIndex=0;
  show('exam');
}
function handleField(target) {
  const {q,field,state:property,sim}=target.dataset;
  if (target.id==='formula-search') { updateSearch(target.value); return; }
  if (sim) {
    const data=simulationData[sim];
    const value=Number(target.value);
    if (!Number.isFinite(value)) return;
    ui.sim[sim]=value;
    target.setAttribute('aria-valuetext',value+' '+data.suffix);
    get('sim-output-'+sim).innerHTML=simResult(sim,value);
    return;
  }
  if (q) {
    const task=byExercise.get(q);
    if (!task || (state.examDone && dsExam.includes(task))) return;
    const record=writableRecord(q);
    record.answers[field]=target.value;
    if (record.checked) {
      record.checked=false;
      get('question-feedback').textContent='';
      for(const marker of root.querySelectorAll('.mark')) marker.textContent='';
    }
    persist();
    return;
  }
  if (property) {
    state[property]=target.value;
    if (property==='firstName' || property==='prefix') {
      target.setCustomValidity('');
      get('rendu-preview').textContent=fileName();
    }
    persist();
  }
}
root.addEventListener('input',event=>{
  if (event.target.tagName!=='SELECT') handleField(event.target);
});
root.addEventListener('change',event=>{
  if (event.target.tagName==='SELECT') handleField(event.target);
});
root.addEventListener('submit',event=>{
  event.preventDefault();
  if(event.target.id==='identity-form') saveReport();
  else runCheck(event.target);
});
document.addEventListener('click',event=>{
  const trigger=event.target.closest('button[data-action]');
  if(!trigger || trigger.disabled) return;
  const {action,id}=trigger.dataset;
  switch(action) {
    case 'view':
      if (id==='formula' && state.view!=='formula') resetFormulaPanel();
      show(id);
      return;
    case 'formula':
      resetFormulaPanel();
      openFormula(id);
      return;
    case 'formula-filter':
      ui.sequence=Number(id);
      for (const b of root.querySelectorAll('[data-action="formula-filter"]')) {
        b.setAttribute('aria-pressed',String(b.dataset.id===id));
      }
      get('formula-results').innerHTML=formulaList();
      return;
    case 'theme-filter':
      ui.themeSequence=Number(id);
      render();
      root.querySelector('[data-action="theme-filter"][data-id="'+id+'"]')?.focus();
      return;
    case 'theme':
      if(state.theme!==id) state.themeQuestion=0;
      state.theme=id;
      show('theme');
      return;
    case 'symbol':
      setSymbol(Number(id));
      return;
    case 'recall':
      setRecall();
      return;
    case 'example':
      ui.example=Math.min(currentFormula().ex.length-1,ui.example+1);
      render();
      focus('example-steps');
      return;
    case 'widget': {
      const t=currentTheme();
      ui.nodes[t.id]=Number(id);
      get('theme-widget').innerHTML=widgetContent(t);
      root.querySelector('[data-action="widget"][data-id="'+id+'"]')?.focus();
      return;
    }
    case 'theme-question':
      navigateQuestion(Number(id),'themeQuestion');
      return;
    case 'station':
      navigateQuestion(Number(id),'station');
      return;
    case 'exam':
      state.examStarted=true;
      show('exam');
      return;
    case 'exam-question':
      navigateQuestion(Number(id),'examIndex');
      return;
    case 'finish-exam':
      finishExam();
      return;
    case 'hint': {
      const q=byExercise.get(id);
      const record=writableRecord(id);
      record.hints=Math.min(record.hints+1,q.hints.length);
      persist();
      render();
      focus('hint-text');
      return;
    }
    case 'solution': {
      const q=byExercise.get(id);
      const record=writableRecord(id);
      if (dsExam.includes(q)?!state.examDone:!record.attempts) return;
      record.reviewed=true;
      persist();
      render();
      focus('solution');
      return;
    }
    case 'backup':
      download(JSON.stringify(state,null,2),'application/json','Atelier_I2D_S1_S2_sauvegarde.json');
      announce('Le téléchargement du JSON a été demandé. Garde ce fichier pour reprendre.');
      return;
    case 'import':
      fileInput.click();
      return;
    case 'reset':
      if (!confirm('Commencer un nouveau travail sur cet appareil ? Télécharge d’abord ta sauvegarde si tu veux garder le travail en cours.')) return;
      state=fresh();
      resetFormulaPanel();
      ui.sim={};
      show('home');
      return;
  }
});
fileInput.addEventListener('change',async()=>{
  const file=fileInput.files[0];
  fileInput.value='';
  if(!file) return;
  if(file.size>500000) { announce('Ce fichier est trop volumineux pour une sauvegarde de cette activité.'); return; }
  try {
    const restored=sanitize(JSON.parse(await file.text()));
    if ((Object.keys(state.records).length || state.examStarted || state.firstName) && !confirm('Ouvrir cette sauvegarde à la place du travail actuel ?')) return;
    state=restored;
    resetFormulaPanel();
    persist();
    notice='Sauvegarde ouverte. Tu as retrouvé tes réponses et le dernier écran.';
    render();
    focus('title');
  } catch(error) {
    announce(error instanceof SyntaxError?'Ce fichier JSON est illisible.':error.message);
  }
});
render();

</script>
</body>
</html>
